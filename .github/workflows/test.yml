name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so both platforms validate against the same rules: this is the version Homebrew
  # installs on macOS. Bumping it changes the Linux cache key, so the next run fetches the
  # new installer instead of reusing the old one.
  VERAPDF_VERSION: 1.30.2

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both platforms report, rather than the first failure cancelling the other. The
      # two are not interchangeable here: which fonts exist decides which checks run,
      # and a failure on one is worth seeing next to a pass on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # The suite verifies output by handing it to real implementations rather than only
      # inspecting bytes it wrote itself. Every one of these skips cleanly when absent,
      # which is exactly why they have to be installed: a runner without them would look
      # green while checking a great deal less.
      #
      #   ghostscript    parses the whole document and rejects a structurally plausible
      #                  file that no reader would open
      #   poppler-utils  pdftotext proves the text is text; pdffonts proves an embedded
      #                  font is embedded, subsetted and mapped back to Unicode
      #   fribidi        the reference implementation the bidirectional algorithm is
      #                  compared against, character for character
      #   verapdf        the PDF/UA reference validator
      #
      # Two font packages carry PostScript outlines because the CFF checks search for a
      # font rather than naming one, and neither package is guaranteed to exist: the first
      # run of this workflow skipped all three CFF tests because the filename they looked
      # for is macOS-only.
      - name: install verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            poppler-utils \
            libfribidi-bin \
            libfribidi-dev \
            fonts-dejavu \
            fonts-stix \
            fonts-texgyre \
            default-jre-headless \
            unzip

      - name: install verification tools
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler fribidi verapdf

      # veraPDF validates the tagged output against PDF/UA-1, and it found six real defects
      # the hand-written structural tests passed straight over — including one that made
      # every tagged sequence in a document read as untagged. Homebrew has it; Debian and
      # Ubuntu do not package it, so on Linux it is installed from the project's own
      # installer.
      #
      # That installer is a 33 MB download from a server that serves it at roughly 50 KB/s,
      # which is far too slow to repeat on every push — hence the cache. The key is the
      # version alone: the artefact is immutable, so a hit is always the right file, and a
      # version bump misses and fetches the new one.
      - name: cache the veraPDF installer
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/verapdf
          key: verapdf-${{ runner.os }}-${{ env.VERAPDF_VERSION }}

      # The installer is IzPack, and its console mode is driven directly here rather than
      # through an auto-install XML file. That is deliberate: the XML names the installer's
      # own panel identifiers, which move between releases, and an earlier attempt at this
      # broke on exactly that. The prompts are stable for a pinned version.
      #
      # Installed under HOME so none of this needs sudo.
      - name: install veraPDF
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          zip="$HOME/.cache/verapdf/verapdf-$VERAPDF_VERSION.zip"
          mkdir -p "$(dirname "$zip")"

          if [ -s "$zip" ]; then
            echo "Using the cached installer."
          else
            echo "Cache miss, downloading."
            curl -sSL --retry 3 --retry-delay 5 -o "$zip" \
              "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-$VERAPDF_VERSION-installer.zip"
          fi

          unzip -q "$zip" -d /tmp/verapdf
          cd "/tmp/verapdf/verapdf-greenfield-$VERAPDF_VERSION"

          # In order: dismiss the welcome, set the install path, confirm creating it,
          # continue, then one answer per optional pack — GUI no, CLI yes, documentation
          # no, sample plugins no — continue, decline the offer to write an install
          # script, and finish.
          printf '1\n%s\nO\n1\nN\nY\nN\nN\n1\nN\n1\n' "$HOME/verapdf" \
            | java -jar "verapdf-izpack-installer-$VERAPDF_VERSION.jar" -console

          echo "$HOME/verapdf" >> "$GITHUB_PATH"

          # A silent failure here would look exactly like the skip it is meant to remove.
          "$HOME/verapdf/verapdf" --version

      # gofmt and go vet. The target fails on unformatted files rather than listing them.
      - name: vet
        run: make vet

      - name: build
        run: go build ./...

      # Verbose, and kept, so the next step can report what did not run.
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log

      # A skipped check is the failure mode this project keeps running into: an assertion
      # that reads like it works and cannot fire is worse than no assertion. Skips are
      # legitimate — a font carrying Arabic presentation forms is not installed everywhere
      # — but which ones skipped decides how much a green run verified, so they go in the
      # run summary rather than staying buried in the log.
      - name: report skipped checks
        if: always()
        run: |
          go run ./scripts/skipreport test.log | tee skipped.txt

          {
            echo "### Skipped on ${{ matrix.os }}"
            echo
            echo '```'
            cat skipped.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fonts and themes are meant to be shared between documents generated
      # concurrently. That promise is only worth making if it is checked.
      - name: race
        run: make race

      - name: coverage
        run: |
          make cover | tee coverage.txt
          {
            echo "### Coverage on ${{ matrix.os }}"
            echo
            echo '```'
            sed -n '/^PACKAGE/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
