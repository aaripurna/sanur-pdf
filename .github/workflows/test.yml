name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Both platforms report, rather than the first failure cancelling the other. The
      # two are not interchangeable here: which fonts exist decides which checks run,
      # and a failure on one is worth seeing next to a pass on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # The suite verifies output by handing it to real implementations rather than only
      # inspecting bytes it wrote itself. Every one of these skips cleanly when absent,
      # which is exactly why they have to be installed: a runner without them would look
      # green while checking a great deal less.
      #
      #   ghostscript    parses the whole document and rejects a structurally plausible
      #                  file that no reader would open
      #   poppler-utils  pdftotext proves the text is text; pdffonts proves an embedded
      #                  font is embedded, subsetted and mapped back to Unicode
      #   fribidi        the reference implementation the bidirectional algorithm is
      #                  compared against, character for character
      #   verapdf        the PDF/UA validator. It found six real defects in the tagged
      #                  output that the hand-written structural assertions could not see,
      #                  including one that made every tagged sequence in a document read
      #                  as untagged
      #
      # Two font packages carry PostScript outlines because the CFF checks search for a
      # font rather than naming one, and neither package is guaranteed to exist: the first
      # run of this workflow skipped all three CFF tests because the filename they looked
      # for is macOS-only.
      - name: install verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            poppler-utils \
            libfribidi-bin \
            libfribidi-dev \
            fonts-dejavu \
            fonts-stix \
            fonts-texgyre \
            default-jre-headless

      # veraPDF is not in Debian, so it comes from its own installer. It is a Java
      # application, which is why the runtime is installed above.
      - name: install veraPDF
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o verapdf.zip \
            https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q verapdf.zip -d verapdf-installer
          installer=$(find verapdf-installer -name 'verapdf-install' | head -1)

          # The installer is interactive unless handed an answer file.
          cat > auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>/opt/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Batch files" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML

          sudo "$installer" auto-install.xml
          sudo ln -sf /opt/verapdf/verapdf /usr/local/bin/verapdf
          verapdf --version

      - name: install verification tools
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler fribidi verapdf verapdf

      # gofmt and go vet. The target fails on unformatted files rather than listing them.
      - name: vet
        run: make vet

      - name: build
        run: go build ./...

      # Verbose, and kept, so the next step can report what did not run.
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log

      # A skipped check is the failure mode this project keeps running into: an assertion
      # that reads like it works and cannot fire is worse than no assertion. Skips are
      # legitimate — a font carrying Arabic presentation forms is not installed everywhere
      # — but which ones skipped decides how much a green run verified, so they go in the
      # run summary rather than staying buried in the log.
      - name: report skipped checks
        if: always()
        run: |
          go run ./scripts/skipreport test.log | tee skipped.txt

          {
            echo "### Skipped on ${{ matrix.os }}"
            echo
            echo '```'
            cat skipped.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fonts and themes are meant to be shared between documents generated
      # concurrently. That promise is only worth making if it is checked.
      - name: race
        run: make race

      - name: coverage
        run: |
          make cover | tee coverage.txt
          {
            echo "### Coverage on ${{ matrix.os }}"
            echo
            echo '```'
            sed -n '/^PACKAGE/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
